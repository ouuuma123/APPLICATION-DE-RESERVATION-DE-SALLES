<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${user.id} ? 'Edit User' : 'Add New User'">User Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2">
                        <i class="fas fa-calendar-check text-blue-600 text-2xl"></i>
                        <span class="text-xl font-bold text-gray-800">RoomBooking</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="fas fa-home mr-1"></i> Home
                    </a>
                    <a href="/rooms" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="fas fa-door-open mr-1"></i> Rooms
                    </a>
                    <a href="/users" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="fas fa-users mr-1"></i> Users
                    </a>
                    <a href="/bookings" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="fas fa-calendar-alt mr-1"></i> Bookings
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="mb-6 bg-green-50 border border-green-200 rounded-lg p-4 flex items-center">
            <i class="fas fa-check-circle text-green-500 mr-3"></i>
            <span class="text-green-700" th:text="${successMessage}">Success message</span>
        </div>

        <div th:if="${errorMessage}" class="mb-6 bg-red-50 border border-red-200 rounded-lg p-4 flex items-center">
            <i class="fas fa-exclamation-circle text-red-500 mr-3"></i>
            <span id="error-mssg" class="text-red-700" th:text="${errorMessage}">Error message</span>
        </div>

        <div class="max-w-2xl mx-auto">
            <div class="mb-6">
                <h1 class="text-3xl font-bold text-gray-900" th:text="${user.id} ? 'Edit User' : 'Add New User'">
                    <i class="fas fa-user text-green-600 mr-2"></i>
                    <span th:text="${user.id} ? 'Edit User' : 'Add New User'">User Form</span>
                </h1>
                <p class="text-gray-600 mt-1" th:text="${user.id} ? 'Update user information' : 'Create a new user account'">Form</p>
            </div>

            <div class="bg-white rounded-xl shadow-md p-8">
                <form th:action="${user.id} ? @{/users/{id}(id=${user.id})} : @{/users}" method="post" th:object="${user}" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-user mr-1"></i> Full Name
                        </label>
                        <input type="text" id="name" th:field="*{name}" required 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors"
                               placeholder="John Doe" />
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-envelope mr-1"></i> Email Address
                        </label>
                        <input type="email" id="email" th:field="*{email}" required 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors"
                               placeholder="john.doe@company.com" />
                    </div>

                    <div>
                        <label for="department" class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-building mr-1"></i> Department
                        </label>
                        <input type="text" id="department" th:field="*{department}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors"
                               placeholder="Engineering, Marketing, etc." />
                    </div>

                    <div class="flex space-x-4 pt-4">
                        <button type="submit" id="submit-btn" class="flex-1 bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition-colors flex items-center justify-center">
                            <i class="fas fa-save mr-2"></i>
                            Save User
                        </button>
                        <a href="/users" class="flex-1 bg-gray-200 text-gray-800 py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors flex items-center justify-center">
                            <i class="fas fa-times mr-2"></i>
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="text-center text-gray-500 text-sm">
                <p>&copy; 2024 Room Reservation System. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
