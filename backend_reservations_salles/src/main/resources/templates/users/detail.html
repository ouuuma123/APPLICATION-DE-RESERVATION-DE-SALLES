<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Detail - Room Reservation System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center space-x-2">
                        <i class="fas fa-calendar-check text-blue-600 text-2xl"></i>
                        <span class="text-xl font-bold text-gray-800">RoomBooking</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="fas fa-home mr-1"></i> Home
                    </a>
                    <a href="/rooms" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="fas fa-door-open mr-1"></i> Rooms
                    </a>
                    <a href="/users" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="fas fa-users mr-1"></i> Users
                    </a>
                    <a href="/bookings" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">
                        <i class="fas fa-calendar-alt mr-1"></i> Bookings
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Flash Messages -->
        <div th:if="${successMessage}" class="mb-6 bg-green-50 border border-green-200 rounded-lg p-4 flex items-center">
            <i class="fas fa-check-circle text-green-500 mr-3"></i>
            <span class="text-green-700" th:text="${successMessage}">Success message</span>
        </div>

        <div th:if="${errorMessage}" class="mb-6 bg-red-50 border border-red-200 rounded-lg p-4 flex items-center">
            <i class="fas fa-exclamation-circle text-red-500 mr-3"></i>
            <span class="text-red-700" th:text="${errorMessage}">Error message</span>
        </div>

        <div class="max-w-2xl mx-auto">
            <div class="mb-6">
                <h1 class="text-3xl font-bold text-gray-900">
                    <i class="fas fa-user text-green-600 mr-2"></i>
                    User Details
                </h1>
                <p class="text-gray-600 mt-1">View user information</p>
            </div>

            <div class="bg-white rounded-xl shadow-md overflow-hidden">
                <div class="bg-gradient-to-r from-green-500 to-green-600 p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 h-16 w-16 bg-white rounded-full flex items-center justify-center">
                            <span class="text-green-600 font-bold text-2xl" th:text="${user.name.charAt(0)}">U</span>
                        </div>
                        <div class="ml-4">
                            <h2 class="text-2xl font-bold text-white" th:text="${user.name}">User Name</h2>
                            <p class="text-green-100 mt-1">
                                <i class="fas fa-envelope mr-1"></i>
                                <span th:text="${user.email}">email@example.com</span>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="p-6 space-y-4">
                    <div class="flex items-center justify-between py-3 border-b border-gray-100">
                        <span class="text-gray-600">
                            <i class="fas fa-hashtag mr-2"></i>ID
                        </span>
                        <span class="font-semibold text-gray-900" th:text="${user.id}">1</span>
                    </div>

                    <div class="flex items-center justify-between py-3 border-b border-gray-100">
                        <span class="text-gray-600">
                            <i class="fas fa-envelope mr-2"></i>Email
                        </span>
                        <span class="font-semibold text-gray-900" th:text="${user.email}">email@example.com</span>
                    </div>

                    <div class="flex items-center justify-between py-3 border-b border-gray-100">
                        <span class="text-gray-600">
                            <i class="fas fa-building mr-2"></i>Department
                        </span>
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800" th:text="${user.department} ?: 'N/A'">
                            Department
                        </span>
                    </div>
                </div>

                <div class="bg-gray-50 px-6 py-4 flex space-x-4">
                    <a th:href="@{/users/{id}/edit(id=${user.id})}" 
                       class="flex-1 bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 transition-colors flex items-center justify-center">
                        <i class="fas fa-edit mr-2"></i>
                        Edit User
                    </a>
                    <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post" class="flex-1" onsubmit="return confirm('Are you sure you want to delete this user?');">
                        <button type="submit" class="w-full bg-red-600 text-white py-2 px-4 rounded-lg hover:bg-red-700 transition-colors flex items-center justify-center">
                            <i class="fas fa-trash mr-2"></i>
                            Delete User
                        </button>
                    </form>
                    <a href="/users" class="flex-1 bg-gray-200 text-gray-800 py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors flex items-center justify-center">
                        <i class="fas fa-arrow-left mr-2"></i>
                        Back to List
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="text-center text-gray-500 text-sm">
                <p>&copy; 2024 Room Reservation System. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
